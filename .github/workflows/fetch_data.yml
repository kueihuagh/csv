name: fetch-market-data

on:
  schedule:
    # 07:00 UTC = 16:00 JST（平日のみ）
   - cron: "50 6 * * 1-5"
  workflow_dispatch: {}  # 手動実行ボタンも使えるようにしておく

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install yfinance pandas

      - name: データ取得スクリプトを実行
        run: python scripts/fetch_all.py

      - name: 変更をコミット
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "daily data update: $(date +'%Y-%m-%d')"
          git push
