name: fetch-market-data

on:
  workflow_dispatch: {}  # 手動実行ボタン
  repository_dispatch:
    types: [run-fetch]   # 外部（cron-job.org）からのHTTPリクエストで起動

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install yfinance pandas

      - name: データ取得スクリプトを実行
        run: python scripts/fetch_all.py

      - name: 変更をコミット
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "daily data update: $(date +'%Y-%m-%d')"
          git push
